[package]
name = "specr"
version = "0.1.0"
edition = "2021"
description = "A CLI tool that turns a rough idea into a structured SPEC.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
rustyline = { version = "14", features = ["derive"] }
async-trait = "0.1"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
